<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Gem Rush – Match-3 Puzzle</title>
<style>
:root{--bg:#0b1020;--card:#161d38;--txt:#eef1ff;--mut:#8b94b8;--acc:#7c5cff;--gold:#ffc94d;--ok:#35e0a1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(circle at 50% -10%,#2a2170 0,#0b1020 55%) fixed;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;user-select:none;-webkit-user-select:none;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{width:min(100%,470px);height:100%;display:flex;flex-direction:column;gap:12px;padding:12px;justify-content:center}
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pill{background:var(--card);border:1px solid #ffffff12;border-radius:16px;padding:8px 10px;text-align:center}
.pill small{display:block;color:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.pill b{font-size:20px}
.bar{height:12px;background:#0f1630;border-radius:99px;overflow:hidden;border:1px solid #ffffff12}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#ff6bd6,var(--gold));border-radius:99px;transition:width .5s cubic-bezier(.2,.9,.3,1)}
.row{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:6px}
#board{position:relative;width:100%;aspect-ratio:1;background:linear-gradient(160deg,#18214a,#0f1630);border-radius:24px;border:1px solid #ffffff14;box-shadow:0 20px 50px #0008,inset 0 0 40px #7c5cff22;overflow:hidden}
#grid{position:absolute;inset:8px;touch-action:none}
.tile{position:absolute;left:0;top:0;width:calc(100%/7);height:calc(100%/7);padding:3px;transition:transform .24s cubic-bezier(.3,.9,.35,1.05),opacity .25s}
.gem{width:100%;height:100%;position:relative;transition:transform .2s,opacity .22s;animation:in .3s}
.gem::after{content:"";position:absolute;left:20%;top:14%;width:34%;height:24%;border-radius:50%;background:#fff9;filter:blur(1px)}
@keyframes in{from{transform:scale(.3);opacity:0}}
.pop .gem{transform:scale(1.5);opacity:0}
.sel .gem{transform:scale(.82);filter:brightness(1.4)}
.shake{animation:sh .22s}
@keyframes sh{25%{margin-left:-4px}75%{margin-left:4px}}
.g0{background:linear-gradient(145deg,#ff7aa8,#e0306b);border-radius:50%}
.g1{background:linear-gradient(145deg,#6fb3ff,#2563eb);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.g2{background:linear-gradient(145deg,#6df0b0,#12a36a);border-radius:26%}
.g3{background:linear-gradient(145deg,#ffd76a,#f59e0b);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.g4{background:linear-gradient(145deg,#c4a4ff,#7c3aed);clip-path:polygon(50% 4%,98% 92%,2% 92%)}
.g5{background:linear-gradient(145deg,#6ff0f5,#0891b2);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.sp{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:sp .55s forwards}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.boost{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.b{background:var(--card);border:1px solid #ffffff14;border-radius:16px;padding:10px 4px;font-size:13px;transition:transform .15s,background .2s}
.b span{display:block;font-size:22px}.b em{font-style:normal;color:var(--gold);font-size:12px}
.b:active{transform:scale(.94)}.b:disabled{opacity:.4}.b.on{background:var(--acc)}
#toast{position:fixed;left:50%;top:14%;transform:translate(-50%,-20px);background:#000c;padding:10px 18px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;font-weight:700;z-index:9;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;background:#050814cc;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.3s;z-index:10;padding:20px}
#modal.on{opacity:1;pointer-events:auto}
.box{background:linear-gradient(160deg,#20285a,#141a38);border:1px solid #ffffff1f;border-radius:28px;padding:28px 24px;width:min(100%,360px);text-align:center;transform:scale(.9);transition:.3s;box-shadow:0 30px 80px #000a}
#modal.on .box{transform:none}
.box h1{margin:0 0 6px;font-size:34px;background:linear-gradient(90deg,#ff7aa8,var(--gold),#6ff0f5);-webkit-background-clip:text;background-clip:text;color:transparent}
.box h2{margin:0 0 8px}.box p{color:var(--mut);margin:6px 0 18px}
.stars{font-size:38px;color:var(--gold);letter-spacing:6px;margin:4px 0 8px}
.cta{display:block;width:100%;padding:15px;border-radius:16px;font-weight:800;font-size:17px;background:linear-gradient(90deg,var(--acc),#ff6bd6);margin-top:10px;box-shadow:0 8px 24px #7c5cff55;transition:transform .15s}
.cta:active{transform:scale(.96)}.cta.alt{background:#ffffff14;box-shadow:none}.cta:disabled{opacity:.4}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="pill"><small>Level</small><b id="lv">1</b></div>
    <div class="pill"><small>Moves</small><b id="mv">0</b></div>
    <div class="pill"><small>Coins</small><b id="co">0</b></div>
  </div>
  <div>
    <div class="row"><span>Score <b id="sc" style="color:var(--txt)">0</b></span><span>Goal <b id="tg" style="color:var(--gold)">0</b></span></div>
    <div class="bar"><i id="fill"></i></div>
  </div>
  <div id="board"><div id="grid"></div></div>
  <div class="boost">
    <button class="b" id="bH"><span>🔨</span>Hammer <em>30 🪙</em></button>
    <button class="b" id="bS"><span>🔀</span>Shuffle <em>20 🪙</em></button>
    <button class="b" id="bM"><span>➕</span>+5 Moves <em>50 🪙</em></button>
  </div>
</div>
<div id="toast"></div>
<div id="modal"></div>
<script>
(function(){
"use strict";
var N=7,KEY="gemrush_v1",COL=["#ff7aa8","#6fb3ff","#6df0b0","#ffd76a","#c4a4ff","#6ff0f5"];
var S=load(),g=[],score=0,moves=0,target=0,T=5,busy=true,over=true,sel=null,hammer=false,ps=null,ac=null;
var $=function(i){return document.getElementById(i)};
var grid=$("grid"),M=$("modal");

function load(){var d={lvl:1,coins:100,sound:true};try{var o=JSON.parse(localStorage.getItem(KEY));if(o&&typeof o==="object"){if(+o.lvl>0)d.lvl=Math.floor(o.lvl);if(+o.coins>=0)d.coins=Math.floor(o.coins);d.sound=o.sound!==false}}catch(e){}return d}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function rnd(n){return Math.floor(Math.random()*n)}
function beep(f,d){if(!S.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),v=ac.createGain();o.type="triangle";o.frequency.value=f;v.gain.setValueAtTime(.07,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(d||.12));o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.12))}catch(e){}}
function buzz(n){try{if(S.sound&&navigator.vibrate)navigator.vibrate(n)}catch(e){}}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){e.classList.remove("on")},1400)}

function pos(o,x,y){o.e.style.transform="translate("+x*100+"%,"+y*100+"%)"}
function mk(r,c,t,fromY){var e=document.createElement("div");e.className="tile";e.innerHTML='<div class="gem g'+t+'"></div>';var o={t:t,e:e};grid.appendChild(e);
  if(fromY!==undefined){e.style.transition="none";e.style.opacity=0;pos(o,c,fromY);void e.offsetWidth;e.style.transition="";e.style.opacity=1}
  pos(o,c,r);return o}
function matches(){var m=new Set(),r,c,a,b,d;
  for(r=0;r<N;r++)for(c=0;c<N;c++){a=g[r][c];if(!a)continue;
    if(c<N-2){b=g[r][c+1];d=g[r][c+2];if(b&&d&&a.t===b.t&&a.t===d.t){m.add(a);m.add(b);m.add(d)}}
    if(r<N-2){b=g[r+1][c];d=g[r+2][c];if(b&&d&&a.t===b.t&&a.t===d.t){m.add(a);m.add(b);m.add(d)}}}
  return m}
function swapData(r1,c1,r2,c2){var t=g[r1][c1];g[r1][c1]=g[r2][c2];g[r2][c2]=t}
function hasMove(){for(var r=0;r<N;r++)for(var c=0;c<N;c++){
  if(c<N-1){swapData(r,c,r,c+1);var k=matches().size;swapData(r,c,r,c+1);if(k)return true}
  if(r<N-1){swapData(r,c,r+1,c);k=matches().size;swapData(r,c,r+1,c);if(k)return true}}
  return false}

function hud(){$("lv").textContent=S.lvl;$("mv").textContent=moves;$("co").textContent=S.coins;$("sc").textContent=score;$("tg").textContent=target;
  $("fill").style.width=Math.min(100,score/target*100)+"%";
  var ok=!busy&&!over;$("bH").disabled=!ok||S.coins<30;$("bS").disabled=!ok||S.coins<20;$("bM").disabled=!ok||S.coins<50;$("bH").classList.toggle("on",hammer)}

function startLevel(){
  grid.innerHTML="";g=[];score=0;sel=null;hammer=false;over=false;busy=true;
  T=S.lvl<4?5:6;moves=Math.max(14,24-Math.floor(S.lvl/2));target=350+S.lvl*180;
  do{for(var r=0;r<N;r++){g[r]=[];for(var c=0;c<N;c++){var t;do{t=rnd(T)}while((c>1&&g[r][c-1].t===t&&g[r][c-2].t===t)||(r>1&&g[r-1][c].t===t&&g[r-2][c].t===t);g[r][c]={t:t}}}}while(!hasMove());
  for(r=0;r<N;r++)for(c=0;c<N;c++)g[r][c]=mk(r,c,g[r][c].t);
  busy=false;hud();toast("Level "+S.lvl+" – reach "+target)}

function spark(r,c,t){for(var i=0;i<5;i++){var s=document.createElement("div");s.className="sp";s.style.left="calc("+(c+.5)/N*100+"% - 4px)";s.style.top="calc("+(r+.5)/N*100+"% - 4px)";s.style.background=COL[t];s.style.setProperty("--dx",(rnd(60)-30)+"px");s.style.setProperty("--dy",(rnd(60)-30)+"px");grid.appendChild(s);(function(x){setTimeout(function(){x.remove()},600)})(s)}}
async function clear(set,combo){
  score+=set.size*10*combo;set.forEach(function(o){o.e.classList.add("pop")});beep(380+combo*80,.15);buzz(12);hud();await sleep(230);
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){var o=g[r][c];if(o&&set.has(o)){spark(r,c,o.t);o.e.remove();g[r][c]=null}}}
async function fall(){
  for(var c=0;c<N;c++){var w=N-1,r;
    for(r=N-1;r>=0;r--){if(g[r][c]){if(r!==w){g[w][c]=g[r][c];g[r][c]=null;pos(g[w][c],c,w)}w--}}
    var k=w+1;for(r=w;r>=0;r--)g[r][c]=mk(r,c,rnd(T),r-k-1)}
  await sleep(330)}
async function cascade(m){var combo=1;m=m||matches();
  while(m.size){if(combo>2){toast("Combo x"+combo+"!");beep(900,.2)}await clear(m,combo);await fall();combo++;m=matches()}}
async function after(){
  if(score>=target)return win();
  if(moves<=0)return lose();
  if(!hasMove()){toast("No moves – shuffling");await shuffle()}
  busy=false;hud()}

function unsel(){if(sel&&g[sel.r][sel.c])g[sel.r][sel.c].e.classList.remove("sel");sel=null}
async function trySwap(r1,c1,r2,c2){
  if(busy||over)return;busy=true;unsel();
  var a=g[r1][c1],b=g[r2][c2];swapData(r1,c1,r2,c2);pos(a,c2,r2);pos(b,c1,r1);beep(300,.06);await sleep(210);
  var m=matches();
  if(!m.size){swapData(r1,c1,r2,c2);pos(a,c1,r1);pos(b,c2,r2);a.e.classList.add("shake");b.e.classList.add("shake");beep(160,.15);buzz(30);await sleep(230);a.e.classList.remove("shake");b.e.classList.remove("shake");busy=false;hud();return}
  moves--;hud();await cascade(m);await after()}

function cell(e){var R=grid.getBoundingClientRect(),c=Math.floor((e.clientX-R.left)/R.width*N),r=Math.floor((e.clientY-R.top)/R.height*N);return(r>=0&&r<N&&c>=0&&c<N)?{r:r,c:c}:null}
grid.addEventListener("pointerdown",function(e){if(busy||over)return;var p=cell(e);if(!p)return;
  if(hammer){useHammer(p);return}ps={r:p.r,c:p.c,x:e.clientX,y:e.clientY}});
grid.addEventListener("pointermove",function(e){if(!ps||busy)return;var dx=e.clientX-ps.x,dy=e.clientY-ps.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;var r=ps.r,c=ps.c,r2=r,c2=c;
  if(Math.abs(dx)>Math.abs(dy))c2+=dx>0?1:-1;else r2+=dy>0?1:-1;ps=null;
  if(r2>=0&&r2<N&&c2>=0&&c2<N)trySwap(r,c,r2,c2)});
grid.addEventListener("pointerup",function(){if(!ps)return;var p=ps;ps=null;
  if(sel){var d=Math.abs(sel.r-p.r)+Math.abs(sel.c-p.c);
    if(d===1){trySwap(sel.r,sel.c,p.r,p.c);return}unsel();if(d===0)return}
  sel={r:p.r,c:p.c};g[p.r][p.c].e.classList.add("sel");beep(500,.05)});
grid.addEventListener("pointercancel",function(){ps=null});

async function useHammer(p){
  if(S.coins<30)return;S.coins-=30;save();hammer=false;busy=true;hud();
  var s=new Set([g[p.r][p.c]]);await clear(s,1);await fall();await cascade();await after()}
async function shuffle(){
  var all=[];g.forEach(function(row){row.forEach(function(o){all.push(o)})});var tries=0;
  do{var ts=all.map(function(o){return o.t});for(var i=ts.length-1;i>0;i--){var j=rnd(i+1),x=ts[i];ts[i]=ts[j];ts[j]=x}
    all.forEach(function(o,i){o.t=ts[i]});tries++}while((matches().size||!hasMove())&&tries<80);
  all.forEach(function(o){var gm=o.e.firstChild;gm.className="gem g"+o.t;gm.style.animation="none";void gm.offsetWidth;gm.style.animation=""});
  beep(600,.2);await sleep(350)}

$("bH").onclick=function(){if(busy||over||S.coins<30)return;hammer=!hammer;unsel();toast(hammer?"Tap a gem to smash it":"Hammer cancelled");hud()};
$("bS").onclick=async function(){if(busy||over||S.coins<20)return;S.coins-=20;save();busy=true;hammer=false;hud();await shuffle();await cascade();await after()};
$("bM").onclick=function(){if(busy||over||S.coins<50)return;S.coins-=50;moves+=5;save();hammer=false;toast("+5 moves!");beep(700,.2);hud()};

function modal(h){M.innerHTML='<div class="box">'+h+'</div>';M.classList.add("on")}
function close(){M.classList.remove("on")}
function win(){over=true;busy=true;var f=moves/Math.max(14,24-Math.floor(S.lvl/2)),st=f>=.4?3:f>=.15?2:1,bonus=20+st*10+moves*3;
  S.coins+=bonus;S.lvl++;save();hud();beep(660,.2);setTimeout(function(){beep(880,.3)},180);buzz([30,40,60]);
  setTimeout(function(){modal('<h2>Level Complete!</h2><div class="stars">'+"★".repeat(st)+'<span style="opacity:.3">'+"★".repeat(3-st)+'</span></div><p>Score '+score+' · +'+bonus+' 🪙</p><button class="cta" id="nx">Next Level</button>');$("nx").onclick=function(){close();startLevel()}},500)}
function lose(){over=true;busy=true;var c=Math.floor(score/200);S.coins+=c;save();hud();buzz(80);
  setTimeout(function(){modal('<h2>Out of Moves</h2><p>Score '+score+' / '+target+(c?' · +'+c+' 🪙':'')+'</p><button class="cta" id="ex"'+(S.coins<50?' disabled':'')+'>+5 Moves · 50 🪙</button><button class="cta alt" id="rt">Try Again</button>');
    $("ex").onclick=function(){if(S.coins<50)return;S.coins-=50;moves+=5;save();over=false;busy=false;close();hud();toast("+5 moves!")};
    $("rt").onclick=function(){close();startLevel()}},400)}
function home(){modal('<h1>Gem Rush</h1><p>Swipe or tap to match 3+ gems.<br>Earn coins, use boosters, beat every level.</p><button class="cta" id="pl">Play · Level '+S.lvl+'</button><button class="cta alt" id="sn">Sound: '+(S.sound?"On":"Off")+'</button>');
  $("pl").onclick=function(){beep(500,.1);close();startLevel()};
  $("sn").onclick=function(){S.sound=!S.sound;save();$("sn").textContent="Sound: "+(S.sound?"On":"Off");beep(600,.1)}}

document.addEventListener("contextmenu",function(e){e.preventDefault()});
hud();home();
})();
</script>
</body>
</html>
